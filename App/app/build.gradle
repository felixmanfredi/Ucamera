plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.trediresearch.ucamera'
        minSdk 25
        targetSdk 33
        versionCode 5
        versionName '1.3.3'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        // SerialMessageReassembler logga su android.util.Log, che nei test JVM non e'
        // implementato: senza questo ogni chiamata lancerebbe "not mocked".
        unitTests.returnDefaultValues = true
    }
    namespace 'com.trediresearch.ucamera'

}

// Nome del file prodotto: senza, Gradle lo chiama "app-debug.apk" come il nome del
// modulo, e in campo ci si ritrova APK indistinguibili da rinominare a mano.
base {
    archivesName = 'ucamera'
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.3'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "com.android.volley:volley:1.2.1"
    implementation('io.socket:socket.io-client:2.0.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.squareup.retrofit2:retrofit:2.7.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.7.2'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'androidx.compose.foundation:foundation:1.0.0-alpha01'
    implementation 'androidx.compose.foundation:foundation-layout:1.0.0-alpha01'
    implementation 'androidx.compose.material:material:1.0.0-alpha01'
    implementation 'androidx.compose.material:material-icons-core:1.0.0-alpha01'
    implementation 'androidx.compose.material:material-icons-extended:1.0.0-alpha01'
    implementation 'androidx.compose.runtime:runtime:1.0.0-alpha01'
    implementation 'androidx.compose.runtime:runtime-livedata:1.0.0-alpha01'
    implementation 'androidx.compose.runtime:runtime-rxjava2:1.0.0-alpha01'

    implementation 'androidx.compose.ui:ui:1.0.0-alpha01'
    implementation "androidx.ui:ui-tooling:1.0.0-alpha01"

    implementation "androidx.room:room-runtime:2.2.5"
    implementation 'androidx.room:room-ktx:2.2.5'
    implementation "com.jcraft:jsch:0.1.55"

    implementation "androidx.media3:media3-exoplayer:1.9.0"
    implementation "androidx.media3:media3-ui:1.9.0"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.9.0"

    implementation("io.github.xmaihh:serialport:2.1.1")
    implementation("com.github.mik3y:usb-serial-for-android:3.8.0")


}

